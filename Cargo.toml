[package]
name = "soroban-restore-verify"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Offline verification for Soroban restore and TTL extension envelopes"
license = "Apache-2.0"

[lib]
name = "soroban_restore_verify"
path = "src/lib.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
stellar-xdr = { version = "=30.0.0", features = ["base64"] }
thiserror = "=2.0.21"

[dev-dependencies]
tempfile = "=3.27.0"
