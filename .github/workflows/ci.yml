name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
          cache: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build CLI for smoke checks
        run: cargo build --locked

      - name: Check fixture exit codes
        shell: bash
        run: |
          set +e
          target/debug/soroban-restore-verify --input fixtures/valid-restore.xdr --format json > target/smoke-valid.json 2> target/smoke-valid.err
          positive_status=$?
          target/debug/soroban-restore-verify --input fixtures/invalid-restore-temp.xdr --format json > target/smoke-violation.json 2> target/smoke-violation.err
          violation_status=$?
          target/debug/soroban-restore-verify --input fixtures/truncated.xdr --format json > target/smoke-error.json 2> target/smoke-error.err
          error_status=$?
          set -e

          test "$positive_status" -eq 0
          test "$violation_status" -eq 2
          test "$error_status" -eq 3
          grep -Fq '"status": "VERIFIED_LOCAL"' target/smoke-valid.json
          grep -Fq '"status": "VIOLATION"' target/smoke-violation.json
          grep -Fq '"code":"XDR_INVALID"' target/smoke-error.err
